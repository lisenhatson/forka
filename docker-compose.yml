services:
  database:
    build:
      context: ./database
    container_name: postgres_db
    restart: always
    env_file: ./database/.env
    # Don't expose 5432 to host in production — internal only
    expose:
      - "5432"
    volumes:
      - ./database/pg_data:/var/lib/postgresql
      - ./database/pg_logs:/var/log/postgresql
      - ./database/certs:/etc/postgresql/certs:ro
      - ./database/init-scripts:/docker-entrypoint-initdb.d
      - ./database/config/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf
    environment:
      TZ: "Asia/Jakarta"
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}

  backend:
    build:
      context: ./backend
    container_name: django_backend
    restart: always
    env_file: ./backend/.env
    depends_on:
      - database
    # Don't expose 8000 to host — WAF should be the only entry point
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    environment:
      - TZ=Asia/Jakarta
      - DB_HOST=database
      - DB_PORT=5432

  frontend-app:
    build:
      context: ./frontend
    container_name: forka-frontend
    restart: always
    expose:
      - "80"
    volumes:
      - ./config/frontend-default.conf:/etc/nginx/conf.d/default.conf:ro  # uncomment this
    depends_on:
      - backend
    environment:
      - TZ=Asia/Jakarta

  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    restart: always
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      - PARANOIA=1
      - BACKEND=http://frontend-app:80   # WAF forwards everything here, nothing else
      - MODSEC_RULE_ENGINE=on
      - SERVER_NAME=localhost
      - PORT=8080
      - PROXY_SSL=off
      - PROXY_SET_HEADER_X_FORWARDED_PROTO=https
      - SSL_CERT=/etc/nginx/conf.d/server.crt
      - SSL_CERT_KEY=/etc/nginx/conf.d/server.key
      - TZ=Asia/Jakarta
    volumes:
      - ./certs/selfsigned.crt:/etc/nginx/conf.d/server.crt:ro
      - ./certs/selfsigned.key:/etc/nginx/conf.d/server.key:ro
    depends_on:
      - frontend-app
    # Remove the api_routes and proxy_backend volumes entirely
